# Home Assistant -> GroupMind bridge (put the pieces in configuration.yaml
# and automations.yaml). One rest_command posts ANY camera's events into a
# room; works for Nest (via the Nest integration), Reolink, and anything
# else HA can see. The API key lives in HA's secrets.yaml, never here.

rest_command:
  groupmind_post:
    url: "https://groupmind.one/api/v1/messages"
    method: POST
    headers:
      X-API-Key: !secret groupmind_camera_key
      Content-Type: application/json
    payload: >-
      {"room": "{{ room }}", "body": "{{ body }}"
      {%- if image_url is defined and image_url %}, "image_url": "{{ image_url }}"{% endif -%}
      }

